<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Pure Frosted Glass Gradient -->
    <linearGradient id="glassWhiteGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="1.0"/>
      <stop offset="50%" stop-color="#E2E8F0" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#CBD5E1" stop-opacity="0.75"/>
    </linearGradient>

    <!-- Specular Highlight Overlay -->
    <linearGradient id="specularSheen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#94A3B8" stop-opacity="0.4"/>
    </linearGradient>

    <!-- Glass Refraction Bloom -->
    <filter id="glassRefraction" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="12" result="blur1"/>
      <feFlood flood-color="#FFFFFF" flood-opacity="0.35" result="color1"/>
      <feComposite in="color1" in2="blur1" operator="in" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Deep Ambient Drop Shadow -->
    <filter id="subtleShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Fully Transparent Background - Only <> in Liquid Glass Shade -->
  <g filter="url(#subtleShadow)">
    <g filter="url(#glassRefraction)">
      <!-- Left Bracket: < -->
      <path d="M 220 160 L 120 256 L 220 352"
            fill="none"
            stroke="url(#glassWhiteGrad)"
            stroke-width="34"
            stroke-linecap="round"
            stroke-linejoin="round"/>

      <!-- Right Bracket: > -->
      <path d="M 292 160 L 392 256 L 292 352"
            fill="none"
            stroke="url(#glassWhiteGrad)"
            stroke-width="34"
            stroke-linecap="round"
            stroke-linejoin="round"/>

      <!-- Specular Highlight Inner Strokes -->
      <path d="M 218 162 L 122 256 L 218 350"
            fill="none"
            stroke="url(#specularSheen)"
            stroke-width="12"
            stroke-linecap="round"
            stroke-linejoin="round"
            opacity="0.8"/>

      <path d="M 294 162 L 390 256 L 294 350"
            fill="none"
            stroke="url(#specularSheen)"
            stroke-width="12"
            stroke-linecap="round"
            stroke-linejoin="round"
            opacity="0.8"/>
    </g>
  </g>
</svg>
