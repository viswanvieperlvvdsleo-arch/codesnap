name: codesnap
description: "A collaborative coding workspace for students, built with Flutter."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.6
  provider: ^6.1.2
  shared_preferences: ^2.2.3
  google_fonts: ^6.2.1
  lucide_icons_flutter: ^3.0.0
  webview_flutter: ^4.7.0
  code_text_field: ^1.1.0
  highlight: ^0.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  # To load assets if needed (e.g. placeholder thumbnails)
  # assets:
  #   - assets/images/
